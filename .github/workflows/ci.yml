name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Sin continue-on-error ni `|| true`: cualquier paso que falle deja el workflow
# en rojo. El pipeline es fail-closed a propósito.
jobs:
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Los .env reales no se versionan, así que la base de la API se declara
    # aquí de forma explícita: sin esto el runner caería al valor por defecto
    # y la suite dejaría de ser reproducible. Es configuración pública, no un
    # secreto (las VITE_* acaban en el bundle del navegador).
    env:
      VITE_API_URL: /api
      VITE_APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 26 es la versión con la que se desarrolla y se validó el lockfile.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.2.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Registrar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build
