server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para optimización de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Headers de Seguridad de Capa HTTP (Security Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://autenticacion-continua-api-lqar5vfjma-tl.a.run.app wss://autenticacion-continua-api-lqar5vfjma-tl.a.run.app http://localhost:8000 ws://localhost:8000; frame-ancestors 'none';" always;

    # SPA Routing: Redirigir cualquier ruta no estática a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con Hash (JS, CSS, imágenes): Caché inmutable por 1 año
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html: Sin caché estricto para asegurar despliegues inmediatos
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Endpoint de Health Check simple del servidor web
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"andeslog-frontend"}';
    }

    # Manejo de Errores 404/500
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
